name: Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: olclash-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'
          cache: false

      - name: Apply Go runtime patches
        run: |
          cd "$(go env GOROOT)"
          for patch_file in "$GITHUB_WORKSPACE"/.github/patch/*.patch; do
            patch --verbose -p1 < "$patch_file"
          done
          go version

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Restore and validate release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.OLCLASH_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.OLCLASH_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OLCLASH_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OLCLASH_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value_name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!value_name:-}" ]; then
              echo "::error::Required signing secret $value_name is missing"
              exit 1
            fi
          done

          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > release.keystore
          test -s release.keystore
          chmod 600 release.keystore

          keytool -list             -keystore release.keystore             -storepass "$KEYSTORE_PASSWORD"             -alias "$KEY_ALIAS" >/dev/null

          escape_property() {
            printf '%s' "$1" | sed -e 's/\\/\\\\/g' -e 's/:/\\:/g' -e 's/=/\\=/g'
          }

          {
            printf 'keystore.password=%s\n' "$(escape_property "$KEYSTORE_PASSWORD")"
            printf 'key.alias=%s\n' "$(escape_property "$KEY_ALIAS")"
            printf 'key.password=%s\n' "$(escape_property "$KEY_PASSWORD")"
          } > signing.properties
          chmod 600 signing.properties
          echo "Release signing key is readable and alias exists."

      - name: Guard - HandlerService must not exist
        run: |
          if grep -R --line-number --fixed-strings "HandlerService" app/src/main service/src/main core/src/main; then
            echo "HandlerService reference detected. This path is forbidden."
            exit 1
          fi
          echo "HandlerService guard passed."

      - name: Populate embedded Root CA bundle
        run: bash .github/scripts/populate-ca-bundle.sh

      - name: Fetch pinned olcRTC Android runtime
        run: bash .github/scripts/fetch-olcrtc-android.sh

      - name: Build signed Alpha Release APK
        run: ./gradlew assembleAlphaRelease

      - name: Collect and verify ARM64 APK
        run: |
          set -euo pipefail
          mkdir -p release-artifacts

          mapfile -t apks < <(
            find app/build/outputs/apk/alpha/release               -type f -name '*arm64-v8a*.apk' -print
          )

          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one ARM64 release APK, found ${#apks[@]}"
            printf '%s\n' "${apks[@]:-}"
            exit 1
          fi

          output="release-artifacts/OlcLash-v1.1.0-alpha.2-arm64-v8a.apk"
          cp "${apks[0]}" "$output"

          if ! unzip -l "$output" | grep -q 'lib/arm64-v8a/libgojni.so'; then
            echo "::error::olcRTC native runtime is missing from the release APK"
            exit 1
          fi

          dex_symbols="$(unzip -p "$output" 'classes*.dex' | strings)"
          for required_symbol in \
            'Lmobile/LogWriter;' \
            'Lmobile/SocketProtector;' \
            'Lmobile/Mobile$proxyLogWriter;' \
            'Lmobile/Mobile$proxySocketProtector;'
          do
            if ! grep -Fq "$required_symbol" <<<"$dex_symbols"; then
              echo "::error::R8 removed required gomobile symbol: $required_symbol"
              exit 1
            fi
          done

          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner_path"
          "$apksigner_path" verify --verbose --print-certs "$output"
          sha256sum "$output" | tee "$output.sha256"

      - name: Remove signing material
        if: always()
        run: rm -f signing.properties release.keystore

      - name: Upload signed release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OlcLash-v1.1.0-alpha.2-arm64-v8a
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30
