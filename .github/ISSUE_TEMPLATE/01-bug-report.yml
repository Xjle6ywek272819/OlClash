name: Bug report
description: Report reproducible OlcLash behavior
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Remove subscription data, credentials, room IDs, HWIDs, device identifiers, and sensitive hostnames from attachments."
  - type: dropdown
    id: profile
    attributes:
      label: Profile type
      options: [Mihomo / Remnawave, OLCWave / olcRTC, Both, Unknown]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OlcLash version
      placeholder: v1.1.0-alpha.2
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Device model, Android version, ROM
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs and screenshots
      description: Include network type and whether the original client worked on the same network.
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive data check
      options:
        - label: I removed subscription data, credentials, room IDs, HWIDs, device IDs, and other secrets.
          required: true
