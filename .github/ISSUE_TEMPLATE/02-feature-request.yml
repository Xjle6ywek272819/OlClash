name: Feature request
description: Propose an OlcLash improvement
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: profile
    attributes:
      label: Profile scope
      options: [Mihomo / Remnawave, OLCWave / olcRTC, Both, General UI / build / documentation]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem before the implementation.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This request contains no subscription data, credential, room ID, HWID, or other secret.
          required: true
